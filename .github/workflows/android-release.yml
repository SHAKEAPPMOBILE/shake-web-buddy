name: Android Release

# Fires automatically on every push to main — no clicking required, always
# publishes to the "internal" track. Bump versionCode/versionName in
# android/app/build.gradle first if you want this to land as a distinct
# version on Play, not just a re-run of the current one. workflow_dispatch
# is kept as a manual fallback for publishing to alpha/beta/production by
# hand when you're ready to promote a build.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # build.gradle's signingConfig hardcodes this exact path on $HOME —
      # writing the decoded keystore there means zero changes needed to
      # build.gradle itself.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/Desktop"
          echo -n "$KEYSTORE_BASE64" | base64 --decode -o "$HOME/Desktop/shake-buddy-keystore.jks"

      - name: Build signed release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shakebyleo.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
